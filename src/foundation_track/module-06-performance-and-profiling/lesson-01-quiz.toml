[[questions]]
type = "Tracing"
answer.doesCompile = true
answer.stdout = "16\n24"
prompt.program = """
#[repr(C)]
struct A { a: u8, b: u64, c: u32 }
struct B { a: u8, b: u64, c: u32 }

fn main() {
    println!("{}", std::mem::size_of::<B>());
    println!("{}", std::mem::size_of::<A>());
}
"""
context = """
`struct B` uses default `repr(Rust)` — the compiler reorders fields by descending alignment:
`b` (u64, 8-byte align) first, then `c` (u32, 4-byte align), then `a` (u8, 1-byte align).
Layout: b(8) + c(4) + a(1) + 3 pad = 16 bytes.

`struct A` uses `repr(C)` — fields stay in declaration order:
a(1) + 7 pad + b(8) + c(4) + 4 trailing pad = 24 bytes.
The trailing 4 bytes of padding ensure `size_of::<A>()` is a multiple of the struct's
alignment (8, due to the `u64` field).

Output: 16 then 24.
"""
id = "b2b46e9e-1c47-478b-8993-99513d570ea2"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Order fields by name alphabetically — this is the Rust convention for `repr(Rust)`.",
  "Use `#[repr(C)]` on the struct — this gives the compiler maximum freedom to minimise padding.",
  "Use `#[repr(packed)]` — this always produces the smallest possible struct."
]
prompt.prompt = """
A Meridian engineer is defining a `TelemetryHeader` struct that will be stored in
a `Vec` of 5 million entries. The struct has fields of types `u64`, `u32`, `u16`,
`u8`, and another `u64`. What field ordering minimises the struct's size with default
`repr(Rust)` layout?
"""
answer.answer = "Order fields by descending alignment (largest first) — `u64` fields before `u32`, `u32` before `u16`, etc. The compiler can then eliminate inter-field padding."
context = """
With `repr(Rust)`, the compiler is already free to reorder fields. The way to guide it —
and to make intent clear — is to declare fields in descending alignment order: `u64` (8),
`u64` (8), `u32` (4), `u16` (2), `u8` (1). This lets fields serve as natural alignment
padding for each other, eliminating inserted padding bytes. `repr(C)` preserves declaration
order regardless of the compiler's freedom, potentially adding more padding. `repr(packed)`
removes all alignment padding but causes misaligned accesses which are significantly slower
on most architectures.
"""
id = "bb4ae609-85dc-4188-9b19-1bb325c095f4"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "False sharing only occurs with `unsafe` code — safe Rust's ownership model prevents it.",
  "False sharing is prevented automatically by the Rust borrow checker.",
  "False sharing only affects reads — concurrent writes to separate fields are always safe."
]
prompt.prompt = """
The Meridian control plane maintains per-satellite frame counters updated by 48 concurrent
session tasks. After deployment, profiling shows unexpectedly high cache coherence traffic
even though each task writes to its own counter. What is happening and how is it fixed?
"""
answer.answer = "False sharing occurs when two threads write to different variables that occupy the same 64-byte cache line, causing the line to bounce between CPU caches. Use `#[repr(align(64))]` with padding to isolate them."
context = """
Each cache line is 64 bytes. If multiple per-satellite counters (each just 8 bytes for a u64)
are stored consecutively in memory, several counters share each cache line. When task A
writes to its counter, the entire cache line — including task B's counter — is invalidated
in every other core's cache. Task B then has to reload the line even though its counter
value did not change. The fix is `#[repr(align(64))]` with explicit padding to fill the
64-byte line, ensuring each counter occupies exactly one cache line that no other task touches.
"""
id = "16eb16d7-7ab9-44fb-a210-195e2eecefa0"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Use `#[repr(packed)]` — it removes all padding and produces the smallest possible struct.",
  "Use `#[repr(C)]` — it guarantees deterministic layout that C foreign functions can rely on.",
  "Add `#[derive(Copy, Clone)]` — this tells the compiler to optimise the memory layout."
]
prompt.prompt = """
A Meridian engineer wants to minimise padding in a Rust-only struct (no FFI) while
keeping the code idiomatic. Which approach is most appropriate?
"""
answer.answer = "Declare fields in descending alignment order within `repr(Rust)` (the default). The compiler eliminates padding by using larger fields to satisfy alignment requirements of subsequent fields."
context = """
The simplest approach for Rust-only code is to declare fields in descending alignment order
within the default `repr(Rust)` layout. The compiler reorders fields anyway in `repr(Rust)`,
but writing them in order of decreasing size documents the intent and ensures the human-readable
definition matches the effective layout. `repr(packed)` works but causes misaligned accesses
and is slower on most CPUs. `repr(C)` is for FFI, not performance. `#[derive(Copy, Clone)]`
has no effect on memory layout — it only adds trait implementations.
"""
id = "5c728e78-0724-4e08-8a67-fd3639c85a21"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Add the cold data as additional fields in the same struct — co-locating data improves locality.",
  "Use `Box<T>` for all fields regardless of access frequency.",
  "Use `#[repr(C)]` on the combined struct to prevent the compiler from splitting fields."
]
prompt.prompt = """
A Meridian frame router scans 100,000 `TelemetryFrame` structs per second to make
routing decisions based on `satellite_id` and `sequence`. Each struct also carries a
variable-length payload of 0–64KB that is only needed when forwarding frames downstream.
How should the struct be organised for optimal routing performance?
"""
answer.answer = "Keep frequently-accessed fields in a compact header struct, and access cold data (large payloads, metadata) through a separate heap-allocated type. A `Vec<Header>` keeps hot data densely packed for cache-friendly sequential scans."
context = """
Every cache miss loading a struct brings in an entire 64-byte cache line. If the struct
contains both the 16-byte hot header and a 64KB payload pointer/length, the cache line
still only holds the first 64 bytes — but that payload's actual data occupies separate
heap memory that is never touched during routing. The real problem is when hot header
fields and infrequently-accessed "cold" fields (large metadata, debug info) are interleaved,
forcing every cache line load to bring in cold bytes that evict other useful hot data.
Separate the header into a compact struct (`Vec<Header>` for bulk scanning) and access
the body only when actually forwarding.
"""
id = "75b2d49d-492c-472d-b623-83f23f129ef2"
