[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Create a new `Client` per request — each request gets its own isolated connection.",
  "Wrap the `Client` in `Arc<Mutex<Client>>` — it is not thread-safe on its own.",
  "Create one `Client` per task — tasks should not share connection pools."
]
prompt.prompt = """
The Meridian control plane makes concurrent HTTP requests to the TLE catalog API from
48 uplink session tasks. What is the correct way to share the HTTP client?
"""
answer.answer = "Create one `Client` with appropriate configuration and clone it cheaply for each task. `Client` is internally reference-counted — cloning shares the connection pool."
context = """
`reqwest::Client` is designed to be created once and shared. It contains an internal
`Arc`-wrapped connection pool — `Clone` increments that reference count rather than
creating a new pool. Creating a new `Client` per request creates a new pool, discards
all idle connections from previous requests, and accumulates resource overhead at scale.
`Arc<Mutex<Client>>` is unnecessary and incorrect — `Client` is already `Send + Sync`
and all its methods take `&self`.
"""
id = "500c33d6-0604-40b4-9795-058f71d2560d"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "`send().await` returns `Err` for any HTTP error status — no additional check needed.",
  "Check `response.status().as_u16() != 200` — only exact 200 OK is a success.",
  "The JSON deserialization will fail if the response is an error — use `.json()` to check."
]
prompt.prompt = """
After `.send().await` succeeds, how does a Meridian API client detect that the server
returned a 404 Not Found or 503 Service Unavailable?
"""
answer.answer = "Call `response.error_for_status()?` before reading the body. HTTP 4xx/5xx responses do not produce `Err` from `send()` — only network-level failures do."
context = """
`reqwest::Response::send()` returns `Ok(Response)` for any completed HTTP exchange,
including 4xx and 5xx responses. The error only occurs at the network level (connection
refused, timeout, DNS failure). `error_for_status()` converts 4xx/5xx status codes into
`Err(reqwest::Error)` with the status code embedded. Without this call, a 500 response
body would be passed to `.json::<TleRecord>()` and produce a confusing JSON parse error
rather than a clear HTTP error.
"""
id = "d80e6801-3019-4ead-b238-db1bb971e27a"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "It fails to compile — `reqwest::blocking` requires a Tokio runtime to be present.",
  "It panics at runtime — `Client::builder().build()` always fails outside an async context.",
  "It prints nothing — `blocking::Client` suppresses output until a request is made."
]
prompt.prompt = """
The following program uses `reqwest::blocking::Client`. Assuming it compiles with
`reqwest` available, what does it print?

```rust
fn build_client() -> Result<(), String> {
    let client = reqwest::blocking::Client::builder()
        .timeout(std::time::Duration::from_secs(10))
        .build()
        .map_err(|e| e.to_string())?;
    let _ = client;
    println!("client built");
    Ok(())
}

fn main() {
    build_client().unwrap();
}
```
"""
answer.answer = "It prints \"client built\". `reqwest::blocking::Client` is fully synchronous and requires no async runtime — it compiles and runs in a plain `fn main()`."
context = """
`reqwest::blocking::Client` is the synchronous (non-async) version of reqwest. It
compiles and runs fine without a Tokio runtime. The client is built with a 10-second
timeout and dropped immediately. The program prints "client built". The async version
(`reqwest::Client`) has the same API shape but requires `.await` on requests and must
run within an async context.
"""
id = "9be461b0-87b1-4ead-b728-05ca432074a7"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Always retry all errors up to `max_attempts` — eventually the request will succeed.",
  "Retry server errors (5xx) immediately without delay — quick retries resolve transient issues faster.",
  "Retry all HTTP errors including 400 Bad Request — the server state may change."
]
prompt.prompt = """
The Meridian TLE catalog client encounters the following responses on consecutive
requests: first a 503 Service Unavailable, then a 429 Too Many Requests, then a
400 Bad Request. Which should be retried?
"""
answer.answer = "Retry 5xx server errors and network errors with exponential backoff. Do not retry 4xx client errors (except 429) — they indicate a problem with the request itself that will not resolve by retrying."
context = """
503 is a transient server-side failure — retry with backoff. 429 means rate-limited —
retry after the Retry-After delay or with backoff. 400 Bad Request is a client error:
the request itself is malformed (wrong parameters, invalid body format). Retrying a 400
will produce the same 400 every time — the server will not change its mind. Fix the
request, not the retry logic. This distinction between retriable server errors and
non-retriable client errors is fundamental to robust HTTP client design.
"""
id = "bc6e88d9-5e99-4f12-bf0d-b5578477a8dd"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Use one `Client` for all external services — connection pool sharing reduces overhead.",
  "Set a single long timeout (120 seconds) to accommodate the slowest possible service.",
  "Set `.timeout()` only — `connect_timeout` defaults to the same value as `timeout`."
]
prompt.prompt = """
The Meridian control plane calls two HTTP services: a fast internal config service
(P99 < 200ms) and a slow external TLE catalog API (P99 up to 10 seconds under load).
What is the correct client configuration strategy?
"""
answer.answer = "Use separate `Client` instances with separate timeout configurations for services with different latency profiles — a 3-second connect timeout and 5-second total timeout for the fast internal service; a 5-second connect and 20-second total timeout for the slow external API."
context = """
A single client with a 120-second timeout would allow the slow external API to hold
connections for 2 minutes, exhausting the connection pool for the fast internal service.
A single client with a 5-second timeout would prematurely fail the slow API. Separate
clients with separate timeout configurations are the correct solution: each service gets
a timeout calibrated to its actual SLO. `connect_timeout` and `timeout` are independent
— `timeout` covers the full request lifecycle (connection + headers + body), while
`connect_timeout` covers only the TCP handshake.
"""
id = "19b1f1a1-9d01-492a-aa0c-a29ce42b2f0b"
