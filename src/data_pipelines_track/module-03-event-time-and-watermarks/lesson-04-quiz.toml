id = "088cd956-3cbf-4141-9c58-91306698e6c6"
type = "MultipleChoice"
prompt.prompt = """
The lesson's retraction-aware sink uses an UPSERT with `WHERE
excluded.sequence > window_results.sequence`. Operations reports a
case where two operator instances are running (during a rolling
deploy) and both are emitting for window 17: instance A emits
sequence 3, instance B emits sequence 4. The sink correctly stores
sequence 4. A few seconds later, instance A's delayed retransmit
(it tried to emit sequence 3 again, with retry) arrives at the sink.
What does the sink do, and why is the WHERE clause structured this way?
"""
answer.answer = "The sink does nothing. The retransmitted sequence-3 insert tries to UPSERT, but the WHERE clause `excluded.sequence > window_results.sequence` evaluates to `3 > 4` which is false; the UPDATE is skipped, and the existing sequence-4 row is preserved. The strict-greater comparison is precisely what makes the sink robust to delayed retransmits and out-of-order arrival from concurrent operator instances: only strictly-newer sequences win, regardless of arrival order."
prompt.distractors = [
    "The sink overwrites the sequence-4 row with sequence 3, since UPSERT operations are unconditional in SQLite. The WHERE clause is evaluated by the application layer before the UPSERT, but here the application layer is bypassed because the retransmit comes through a different code path",
    "The sink panics with a constraint-violation error because two writers attempting to write to the same window_id is detected as a conflict that the schema does not permit. The fix is to switch to MERGE (Postgres) instead of UPSERT (SQLite), which handles this case",
    "The sink stores both sequence 3 and sequence 4 as separate rows because the primary key is `(window_id, sequence)`, not just `window_id`. The downstream reader must select the row with the highest sequence at query time",
]
context = """
The strict-greater WHERE is the operationally correct treatment of
the lesson's at-least-once-plus-idempotent composition. Delayed
retransmits with stale sequences arrive after newer sequences have
landed; the strict comparison rejects them silently. Concurrent
emitters from different operator instances (rare in steady state,
common during deploys) produce out-of-order arrivals where the same
mechanism applies. The other distractors invent SQL semantics that
do not exist (UPSERT is conditional in SQLite when WHERE clauses
are present), schema designs that the lesson did not propose, and
constraint-violation behaviors that the operator's stated PK
(window_id alone) does not produce.
"""
