prompt.prompt = """
An engineer adds the following function to the Meridian telemetry pipeline to hash
incoming frames for deduplication. After deployment, other tasks on the same executor
thread become noticeably slower. What is the most likely cause?

```rust
async fn hash_frame(data: &[u8]) -> u64 {
    let mut hasher = std::collections::hash_map::DefaultHasher::new();
    for &byte in data {
        std::hash::Hash::hash(&byte, &mut hasher);
    }
    std::hash::Hasher::finish(&hasher)
}
```
"""
answer.answer = "The function performs significant CPU work with no `await` point, monopolizing the executor thread and starving other tasks."
context = """
Async tasks yield voluntarily at `await` points. A function with no `await` runs synchronously from start to finish.
For O(n) CPU work on large inputs — like hashing a 64KB frame — it can hold the executor thread for milliseconds,
preventing other tasks (such as accepting new connections) from being polled. The fix is
`tokio::task::spawn_blocking(|| hash_frame_sync(data)).await`, which moves the CPU work onto a dedicated blocking thread pool.
"""
id = "8e4967ac-eef1-4fbd-8ee0-352ce19ca067"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "Store `cx` directly as a field on the future struct for use in the callback.",
  "Call `Poll::Pending` only once; subsequent polls should return `Poll::Ready` unconditionally.",
  "Register the waker by calling `cx.waker().wake_by_ref()` immediately before returning `Poll::Pending`."
]
prompt.prompt = """
A Meridian engineer is implementing a custom future that wraps a C library callback.
The library calls the provided function pointer when data is available. Which of the
following correctly satisfies the waker contract?
"""
answer.answer = "Clone `cx.waker()` into an `Arc<Mutex<Option<Waker>>>`, and have the C callback call `waker.wake()` when data arrives."
context = """
`Context<'_>` cannot be stored across poll calls — it is a borrow valid only for the duration of that `poll` invocation.
The `Waker` it contains can be cloned and stored. The C callback (running on an arbitrary thread) calls `waker.wake()`,
which re-queues the task. The `Arc<Mutex<Option<Waker>>>` pattern ensures both the future and the callback can safely
access the waker across threads.

Calling `wake_by_ref()` immediately before returning `Pending` (the distractor) would re-queue the task immediately,
causing a busy-polling loop — the task would be polled, return Pending again, re-queue itself, and repeat indefinitely.
"""
id = "f43bf5ca-2294-411c-a933-b064a720ed09"
