[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "`try_recv` is not an async operation and cannot be used inside `poll`.",
  "The future returns `Poll::Pending` before the buffer has been initialized.",
  "The `poll` signature requires `&mut Context<'_>` to be named `cx` — using `_cx` is undefined behavior."
]
prompt.prompt = """
A Meridian engineer writes the following custom future. After deploying it, ground station
connections occasionally hang indefinitely with no error logged. What is the most likely cause?

```rust
impl Future for GroundStationFuture {
    type Output = Frame;

    fn poll(mut self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<Self::Output> {
        match self.buffer.try_recv() {
            Ok(frame) => Poll::Ready(frame),
            Err(_) => Poll::Pending,
        }
    }
}
```
"""
answer.answer = "The context's waker is never registered. When `poll` returns `Pending`, nothing will reschedule this task, so it parks forever."
context = """
The waker contract: if `poll` returns `Poll::Pending`, the future must arrange for `cx.waker()` to be called
when the awaited resource becomes available. Here, `_cx` is discarded, so no waker is registered. The executor
parks the task and never re-queues it. The connection silently hangs. The fix is to store `cx.waker().clone()`
and call it when data arrives — or, better, use a `tokio::sync` primitive that handles waker registration automatically.
"""
id = "d243e646-d080-485f-b332-b67bd9910c67"

[[questions]]
type = "MultipleChoice"
prompt.distractors = [
  "`tokio::spawn` both futures and `.await` each handle sequentially.",
  "Use `std::thread::spawn` for each fetch; async is only for single-threaded code.",
  "`.await` each future in sequence — Tokio automatically parallelizes sequential awaits."
]
prompt.prompt = """
The Meridian control plane needs to fetch the latest TLE update from two independent
ground stations before computing a conjunction window. Which approach correctly fetches
both concurrently without spawning new OS threads?
"""
answer.answer = "`tokio::join!(fetch_tle(station_a), fetch_tle(station_b))` — both futures are polled concurrently within the same task."
context = """
`tokio::join!` polls multiple futures interleaved within a single task. While one future is pending (waiting on I/O),
the executor drives the other forward. Total latency approaches the max of the two individual latencies rather than
the sum. `tokio::spawn` would also achieve concurrency but creates independent tasks that may run on separate
threads — appropriate for CPU-bound or fully independent work, but heavier than `join!` for simple concurrent I/O.
"""
id = "8a05906c-d345-4711-81d5-5ce55ea01003"

[[questions]]
type = "Tracing"
answer.doesCompile = true
answer.stdout = "42"
prompt.program = """
use std::future::Future;
use std::pin::Pin;
use std::task::{Context, Poll, RawWaker, RawWakerVTable, Waker};

struct ImmediateFuture;

impl Future for ImmediateFuture {
    type Output = u32;
    fn poll(self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<Self::Output> {
        Poll::Ready(42)
    }
}

fn noop_waker() -> Waker {
    fn noop(_: *const ()) {}
    fn clone(p: *const ()) -> RawWaker { RawWaker::new(p, &VTABLE) }
    static VTABLE: RawWakerVTable = RawWakerVTable::new(clone, noop, noop, noop);
    unsafe { Waker::from_raw(RawWaker::new(std::ptr::null(), &VTABLE)) }
}

fn main() {
    let mut future = ImmediateFuture;
    let waker = noop_waker();
    let mut cx = Context::from_waker(&waker);
    match Pin::new(&mut future).poll(&mut cx) {
        Poll::Ready(val) => println!("{val}"),
        Poll::Pending => println!("pending"),
    }
}
"""
context = """
`ImmediateFuture::poll` returns `Poll::Ready(42)` on the very first poll. The noop waker is sufficient because
the future never returns `Pending` — it never needs to be re-scheduled. `println!("{val}")` prints `42`.
This is exactly what an executor does under the hood: construct a `Context`, call `poll`, and match on the result.
"""
id = "119490e3-b860-4d99-9dd5-7ab9b5b1fe05"

