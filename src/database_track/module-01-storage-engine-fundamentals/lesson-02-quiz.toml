[[questions]]
type = "MultipleChoice"
prompt.prompt = """
The OOR buffer pool has 1,000 frames (4MB total). During a peak pass window, 50 concurrent
conjunction queries each pin 10 pages for the duration of their computation. A catalog export
job starts a sequential scan over all 4,000 pages. What happens?
"""
prompt.distractors = [
  "The scan completes normally because unpinned pages are evicted on demand to make room.",
  "The scan fails immediately because 500 frames are pinned and the remaining 500 cannot hold 4,000 pages.",
  "The buffer pool automatically increases its size to accommodate the scan."
]
answer.answer = "The scan proceeds but causes severe LRU pollution — every hot conjunction-query page that is currently unpinned gets evicted by the scan. When conjunction queries unpin and re-request their pages, they all miss the buffer pool and go to disk."
context = """
500 frames are pinned by conjunction queries. The remaining 500 are available for the scan.
The scan doesn't fail — it cycles through those 500 frames, evicting whatever was there. But
after the scan passes, the 500 frames now hold scan pages, not the conjunction queries' hot set.
When the conjunction queries unpin their current pages and request new ones, those pages have been
evicted. The result: a burst of disk I/O that spikes conjunction query latency. This is the
classic 'sequential scan flooding' problem. The scan itself doesn't fail, but it degrades every
other workload sharing the buffer pool. Mitigations: scan-resistant eviction (CLOCK-sweep),
separate buffer pools for scan vs. point-lookup workloads, or limiting scan concurrency.
"""
id = "112f5d0a-15a4-4412-96db-cf99426bcb31"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
An engineer notices that the OOR buffer pool hit rate is 99.8% under normal load, but conjunction
query latency still shows periodic 50ms spikes. The spikes correlate with background dirty page
flushes. What is the most likely cause?
"""
prompt.distractors = [
  "The background flush thread is holding a global lock on the buffer pool, blocking all fetch operations.",
  "Dirty page flushes call `fsync` which blocks the entire I/O subsystem.",
  "The hit rate calculation is incorrect because it doesn't count dirty page reads."
]
answer.answer = "Evictions that hit a dirty page must synchronously flush it to disk before the frame can be reused. If background flushing hasn't cleaned the page yet, the fetch blocks on the write, causing the latency spike."
context = """
When `fetch_page` needs to evict a dirty frame, it must write the page to disk before loading the
new page. This is a synchronous write on the hot path — the caller blocks until the write
completes. Background flushing exists to mitigate this: by proactively writing dirty pages, it
reduces the chance that an eviction hits a dirty frame. The spikes indicate the background flusher
isn't keeping up, or the dirty page chosen for eviction was dirtied after the last flush cycle.
A well-tuned system keeps the ratio of dirty-to-clean evictable frames low. The flush thread does
not typically hold a global lock (it flushes one page at a time with brief locks), and `fsync` is
not called per-flush in a WAL-based engine.
"""
id = "5b04c850-6cb6-41f9-b8e8-16536ac07504"

[[questions]]
type = "Tracing"
prompt.program = """
fn main() {
    let num_frames: usize = 4;
    let mut pin_counts: Vec<u32> = vec![0; num_frames];

    // Simulate: fetch page into frame 0, pin it
    pin_counts[0] += 1;
    // Fetch same page again (second user)
    pin_counts[0] += 1;
    // First user unpins
    pin_counts[0] -= 1;
    // Second user unpins
    pin_counts[0] -= 1;

    let evictable = pin_counts.iter().filter(|&&c| c == 0).count();
    println!("pin={} evictable={}", pin_counts[0], evictable);
}
"""
answer.doesCompile = true
answer.stdout = "pin=0 evictable=4"
context = """
The pin count tracks concurrent users of a page. Two users pin the same frame (count goes to 2),
then both unpin (count returns to 0). When pin_count is 0, the frame is evictable. All 4 frames
have pin_count 0 (frames 1-3 were never pinned, frame 0 was fully unpinned), so all 4 are
evictable. This demonstrates that pin counting is a reference count — the page becomes evictable
only when ALL users have released it.
"""
id = "28ae8a60-3351-4936-b0ff-53419d97f60b"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
Consider this buffer pool CLOCK sweep state. The clock hand is at position 0.
Frames: `[ref=1, pin=0]  [ref=0, pin=1]  [ref=0, pin=0]  [ref=1, pin=0]`

Which frame gets evicted?
"""
prompt.distractors = [
  "Frame 0 — it is the first frame the clock hand encounters.",
  "Frame 1 — it has ref=0 so it hasn't been accessed recently.",
  "Frame 3 — the clock hand wraps around and finds ref=1, which means it was used longest ago."
]
answer.answer = "Frame 2 — the clock hand clears frame 0's ref bit (ref=1→0), skips frame 1 (pinned), and finds frame 2 with ref=0 and pin=0."
context = """
CLOCK sweep: (1) Frame 0 has ref=1, so the hand clears it to 0 and advances. (2) Frame 1 has
ref=0 but pin=1, so it cannot be evicted — skip it. (3) Frame 2 has ref=0 and pin=0 — this is
the eviction target. The hand stops here. Frame 3 is never examined. The key insight: pinned pages
are always skipped regardless of their reference bit, and ref=1 gives a page a 'second chance'
by clearing the bit rather than evicting immediately.
"""
id = "0e3ad8f7-86fe-425f-951b-527b28a1b333"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
A Meridian engineer implements the buffer pool's `PageHandle` with RAII unpinning but uses
`&'a mut BufferPool` as the borrow. During B-tree traversal, the engine needs to hold a
reference to a parent node page while fetching a child node page. The code fails to compile.
Why?
"""
prompt.distractors = [
  "Rust does not allow two `PageHandle` instances to exist simultaneously under any circumstances.",
  "The `Drop` implementation on `PageHandle` prevents the compiler from reasoning about lifetimes.",
  "B-tree traversal requires `unsafe` code because it involves pointer arithmetic on page data."
]
answer.answer = "The `&'a mut BufferPool` borrow in the first `PageHandle` exclusively borrows the buffer pool, so fetching a second page (which also needs `&mut BufferPool`) violates Rust's exclusive borrow rule."
context = """
This is a real design tension in Rust buffer pool implementations. The `&'a mut BufferPool` borrow
is exclusive — while one `PageHandle` exists, no other code can call `fetch_page`. B-tree traversal
inherently requires holding multiple pages simultaneously (parent + child at minimum). Solutions:
(1) Use `Rc<RefCell<BufferPool>>` or `Arc<Mutex<BufferPool>>` with interior mutability so handles
don't exclusively borrow the pool. (2) Use unsafe to split the borrow (frame data is disjoint from
pool metadata). (3) Copy the page data out of the frame before unpinning, eliminating the borrow.
Option (1) is safest; option (2) is fastest; option (3) is simplest but wastes memory.
"""
id = "14313647-b9e4-4d15-bbd6-aac6cf540002"
