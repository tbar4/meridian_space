[[questions]]
type = "Tracing"
prompt.program = """
fn main() {
    // B+ tree: 4KB pages, 4-byte keys, 4-byte child pointers
    let page_size: usize = 4096;
    let header: usize = 20;
    let key_size: usize = 4;
    let ptr_size: usize = 4;

    // Internal node: (ptr, key, ptr, key, ..., ptr)
    // n keys need n+1 pointers: n*(key+ptr) + ptr <= usable
    let usable = page_size - header;
    let max_keys = (usable - ptr_size) / (key_size + ptr_size);
    let branching = max_keys + 1;

    println!("usable={} max_keys={} branching={}", usable, max_keys, branching);
}
"""
answer.doesCompile = true
answer.stdout = "usable=4076 max_keys=509 branching=510"
context = """
The branching factor of a B-tree is determined by how many key-pointer pairs fit in one page.
An internal node with n keys has n+1 child pointers. The layout is:
[ptr_0][key_0][ptr_1][key_1]...[ptr_n-1][key_n-1][ptr_n]
Total bytes: n * (key_size + ptr_size) + ptr_size = n * 8 + 4.
Usable space: 4096 - 20 = 4076 bytes. Solving: n * 8 + 4 <= 4076 gives n <= 509.
So max 509 keys and 510 children per node. This high branching factor is why B-trees
are so effective for disk-based access — the tree is extremely shallow.
"""
id = "4cea1c51-e5bd-4c2e-92b5-265bd289eb4a"

